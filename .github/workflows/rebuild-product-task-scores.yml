name: Rebuild product task scores

on:
  push:
    paths:
      - "data/evidence/**"
      - "data/task-solution-map/**"
      - "data/pricing/**"
      - "data/tasks.json"
      - "data/observations.json"
      - "scripts/build_product_task_scores.py"
      - ".github/workflows/rebuild-product-task-scores.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-product-task-scores
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild scores
        run: python3 scripts/build_product_task_scores.py
      - name: Verify generated score set
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          idx=json.loads(Path("data/task-scores/index.json").read_text())
          mapping=json.loads(Path("data/task-solution-map/all-current.json").read_text())
          expected=sum(len(x["candidates"]) for x in mapping)
          assert idx["scored_pairs"] == expected, (idx["scored_pairs"], expected)
          assert idx["task_count"] == 86
          print(f"verified {idx['scored_pairs']} scored pairs, version {idx['scoring_version']}")
          PY
      - name: Commit generated scores
        run: |
          if git diff --quiet -- data/task-scores data/evidence/index.json data/evidence/coverage-by-solution.json docs/evidence-collection-progress.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/task-scores data/evidence/index.json data/evidence/coverage-by-solution.json docs/evidence-collection-progress.md
          git commit -m "Rebuild product-task evidence scores"
          git push
